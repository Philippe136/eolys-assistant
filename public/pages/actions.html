<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vox">
<meta name="theme-color" content="#f5f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<title>Vox — Items</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Native PWA feel ── */
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { overscroll-behavior: none; }
  body { overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
  button, a, [role="button"] { touch-action: manipulation; }
  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --surface2: #f0ece5;
    --border: #e0d9cf;
    --ink: #1a1714;
    --ink-muted: #7a7268;
    --ink-dim: #b5afa6;
    --accent: #c8410a;
    --accent-light: #f5ede8;
    --green: #1a6b3c;
    --green-light: #e8f3ec;
    --red: #b91c1c;
    --red-light: #fef2f2;
    --radius: 12px;
  }

  :root[data-theme="dark"] {
  --bg: #151210;
  --surface: #1e1b18;
  --surface2: #252220;
  --border: #35302a;
  --ink: #f0ece5;
  --ink-muted: #a09890;
  --ink-dim: #6a6460;
  --accent-light: #3a1a0a;
  --green-light: #0d2e1a;
  --yellow-light: #2a2000;
  --red-light: #2a0d0d;
  --blue-light: #0d1a3a;
}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: env(safe-area-inset-top, 0px) 24px 0;
    height: calc(56px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo svg { flex-shrink: 0; display: block; }

  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }

  .header-actions { display: flex; align-items: center; gap: 8px; }

  .btn-ghost {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--ink); }
  .btn-ghost.active { color: var(--ink); background: var(--surface2); }

  /* ── Main ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 96px;
  }

  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .page-subtitle { font-size: 14px; color: var(--ink-muted); margin-bottom: 28px; }

  /* ── Stats bar ── */
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 20px;
    flex: 1;
    min-width: 80px;
    text-align: center;
  }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── Filtre ── */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
  }
  .btn-filter {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 18px;
    border-radius: 7px;
    border: none;
    background: none;
    color: var(--ink-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-filter:hover { color: var(--ink); }
  .btn-filter.active { background: var(--accent); color: #fff; }

  /* ── Groups ── */
  .project-group {
    margin-bottom: 20px;
  }

  .project-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .project-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-muted);
  }

  .project-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--accent-light);
    color: var(--accent);
  }

  .project-badge.all-done {
    background: var(--green-light);
    color: var(--green);
  }

  /* ── Action rows ── */
  .actions-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .action-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .action-row:last-child { border-bottom: none; }
  .action-row:hover { background: var(--surface2); }
  .action-row.done { opacity: 0.55; }
  .action-row.in-progress { border-left: 3px solid var(--accent); }

  .action-row-inner {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    cursor: default;
    width: 100%;
    flex-wrap: wrap;
  }

  /* Bouton statut 3 états */
  .status-btn {
    width: 20px; height: 20px; border: none; background: none;
    cursor: pointer; padding: 0; flex-shrink: 0; margin-top: 2px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s;
  }
  .status-btn:hover { transform: scale(1.2); }
  .status-todo        { color: var(--ink-dim); }
  .status-in-progress { color: var(--accent); animation: status-pulse 1.8s ease-in-out infinite; }
  .status-done        { color: var(--green); }
  @keyframes status-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  /* Bouton déléguer IA */
  .btn-delegate {
    font-size: 10px; font-weight: 700; font-family: 'Inter', sans-serif;
    padding: 2px 8px; border-radius: 6px;
    background: var(--accent-light); color: var(--accent);
    border: none; cursor: pointer; flex-shrink: 0; margin-top: 3px;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-delegate:hover { background: #f0d5c8; }
  .btn-delegate:disabled { opacity: 0.5; cursor: default; }

  /* Résultat agent */
  .agent-result {
    width: 100%; margin-top: 8px; padding: 10px 14px;
    background: var(--accent-light); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.6;
    color: var(--ink); white-space: pre-wrap; word-break: break-word;
  }

  .action-row-body { flex: 1; min-width: 0; }

  .action-row-text {
    display: block;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
    transition: text-decoration 0.15s, color 0.15s;
  }
  .action-row.done .action-row-text {
    text-decoration: line-through;
    color: var(--ink-dim);
    font-weight: 500;
  }

  .action-row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    flex-wrap: wrap;
  }

  .meta-sep { color: var(--border); }

  /* ── Fade out animation ── */
  @keyframes fadeOut {
    from { opacity: 1; max-height: 80px; }
    to   { opacity: 0; max-height: 0; padding: 0; overflow: hidden; }
  }

  /* ── Empty / loading ── */
  .state-empty, .state-loading, .state-error {
    text-align: center;
    padding: 64px 24px;
    color: var(--ink-muted);
  }
  .state-empty-icon { font-size: 48px; margin-bottom: 12px; }
  .state-empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }

  .state-loading-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--ink-dim);
    border-radius: 50%;
    animation: pulse 1s infinite;
    margin: 0 2px;
  }
  .state-loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .state-loading-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1); }
  }

  @media (max-width: 640px) {
    main { padding: 20px 16px 80px; }
    .action-row-inner { padding: 12px 14px; gap: 10px; }
  }

  /* ── Bottom Navigation ── */
  .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border); align-items: stretch; justify-content: space-around; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (max-width: 640px) { .mobile-nav { display: flex; } }
  .mobile-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex: 1; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; transition: color 0.15s; }
  .mobile-nav a.active { color: var(--accent); }
  .mobile-nav a svg { width: 24px; height: 24px; }
  .mobile-nav a.nav-record { font-size: 24px; background: var(--accent); color: white; width: 48px; height: 48px; border-radius: 50%; margin-top: -12px; align-self: center; flex: none; }

  /* ── Bouton refresh ── */
  .btn-refresh {
    width: 32px; height: 32px; border: none; background: none; cursor: pointer;
    padding: 0; border-radius: 8px; color: var(--ink-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .btn-refresh:hover { background: var(--surface2); color: var(--ink); }
  .btn-refresh.spinning svg { animation: spin-refresh 0.65s linear infinite; }
  @keyframes spin-refresh { to { transform: rotate(360deg); } }

  .btn-theme-toggle { font-size: 18px !important; padding: 4px 8px !important; }

  .btn-primary {
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 700;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.88; }

  /* ── Responsive header ── */
  @media (max-width: 640px) {
    header { padding: env(safe-area-inset-top, 0px) 16px 0; }
    .header-actions { gap: 8px; }
    .header-actions .btn-ghost { font-size: 11px; padding: 4px 8px; }
    .header-actions .btn-primary { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="0" y="6" width="4" height="6" rx="2" fill="#c8410a"/><rect x="6" y="0" width="4" height="18" rx="2" fill="#c8410a"/><rect x="12" y="3" width="4" height="12" rx="2" fill="#c8410a"/><rect x="18" y="5" width="4" height="8" rx="2" fill="#c8410a"/></svg>
    Vox
  </div>
  <div class="header-actions">
    <a href="/dashboard" class="btn-ghost">Notes</a>
    <a href="/today"     class="btn-ghost">Priorités</a>
    <a href="/gmail"     class="btn-ghost">Gmail</a>
    <a href="/settings"  class="btn-ghost" title="Paramètres">⚙️</a>
    <button class="btn-refresh" id="btn-refresh" onclick="doRefresh()" title="Rafraîchir">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>
    </button>
    <button class="btn-ghost btn-theme-toggle" onclick="toggleTheme()" id="btn-theme" title="Thème sombre/clair" style="font-size:18px;padding:4px 8px">🌙</button>
  </div>
</header>

<main>
  <div class="page-title">Items extraits</div>
  <p class="page-subtitle">Tâches, idées, décisions et rappels issus de vos enregistrements</p>

  <div class="stats" id="stats" style="display:none">
    <div class="stat">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-todo" style="color:var(--accent)">—</div>
      <div class="stat-label">À faire</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-inprogress" style="color:var(--accent)">—</div>
      <div class="stat-label">En cours</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-done" style="color:var(--green)">—</div>
      <div class="stat-label">Faits</div>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar" style="display:none">
    <button class="btn-filter active" id="btn-todo"        onclick="setFilter('todo')">À faire</button>
    <button class="btn-filter"        id="btn-in_progress" onclick="setFilter('in_progress')">En cours</button>
    <button class="btn-filter"        id="btn-all"         onclick="setFilter('all')">Tout</button>
  </div>

  <div id="actions-container">
    <div class="state-loading">
      <span class="state-loading-dot"></span>
      <span class="state-loading-dot"></span>
      <span class="state-loading-dot"></span>
    </div>
  </div>
</main>

<script>
let allActions    = [];
let currentFilter = 'todo';

const STATUS_ICON = {
  todo:        `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/></svg>`,
  in_progress: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3l1.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  done:        `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M5 8.2l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
};
const NEXT_STATUS = { todo: 'in_progress', in_progress: 'done', done: 'todo' };

const ITEM_ICON  = { task: '☐', idea: '💡', decision: '✓', reminder: '🔔' };
const ITEM_LABEL = { task: 'Tâche', idea: 'Idée', decision: 'Décision', reminder: 'Rappel' };
const CAT_LABEL  = { work: 'Travail', personal: 'Perso', idea: 'Idée', meeting: 'Réunion', inbox: 'Inbox' };

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function groupKey(a) {
  return (a.tags && a.tags.length) ? a.tags[0] : (CAT_LABEL[a.category] || a.category || 'inbox');
}

function getStatus(a) {
  return a.status || (a.done ? 'done' : 'todo');
}

function setFilter(f) {
  currentFilter = f;
  ['todo','in_progress','all'].forEach(k => {
    document.getElementById(`btn-${k}`)?.classList.toggle('active', k === f);
  });
  renderAll();
}

function renderAll() {
  const total       = allActions.length;
  const doneCount   = allActions.filter(a => getStatus(a) === 'done').length;
  const inProgCount = allActions.filter(a => getStatus(a) === 'in_progress').length;
  const todoCount   = allActions.filter(a => getStatus(a) === 'todo').length;

  document.getElementById('stats').style.display      = total ? 'flex' : 'none';
  document.getElementById('filter-bar').style.display  = total ? 'flex' : 'none';
  document.getElementById('stat-total').textContent      = total;
  document.getElementById('stat-todo').textContent       = todoCount;
  document.getElementById('stat-inprogress').textContent = inProgCount;
  document.getElementById('stat-done').textContent       = doneCount;

  const filtered = currentFilter === 'todo'
    ? allActions.filter(a => getStatus(a) === 'todo')
    : currentFilter === 'in_progress'
    ? allActions.filter(a => getStatus(a) === 'in_progress')
    : allActions;

  if (!filtered.length) {
    document.getElementById('actions-container').innerHTML = `
      <div class="state-empty">
        <div class="state-empty-icon">${currentFilter === 'todo' ? '✅' : '📭'}</div>
        <div class="state-empty-title">${currentFilter === 'todo' ? 'Tous les items sont faits !' : 'Aucun item.'}</div>
      </div>`;
    return;
  }

  // Grouper par premier tag (ou catégorie), trier par nb non faits desc
  const groups = {};
  for (const a of filtered) {
    const p = groupKey(a);
    if (!groups[p]) groups[p] = [];
    groups[p].push(a);
  }

  const sorted = Object.entries(groups).sort((a, b) => {
    return b[1].filter(x => getStatus(x) !== 'done').length - a[1].filter(x => getStatus(x) !== 'done').length;
  });

  const html = sorted.map(([group, items]) => {
    const pending    = items.filter(a => getStatus(a) !== 'done').length;
    const allDone    = pending === 0;
    const badgeClass = allDone ? 'project-badge all-done' : 'project-badge';
    const badgeText  = allDone ? '✓ tout fait' : `${pending} à faire`;
    return `
      <div class="project-group">
        <div class="project-header">
          <span class="project-name">🏷 ${escapeHtml(group)}</span>
          <span class="${badgeClass}">${badgeText}</span>
        </div>
        <div class="actions-group">
          ${items.map(renderActionRow).join('')}
        </div>
      </div>`;
  }).join('');

  document.getElementById('actions-container').innerHTML = html;
}

function renderActionRow(a) {
  const st         = getStatus(a);
  const stClass    = st === 'in_progress' ? 'in-progress' : st;
  const entryTitle = escapeHtml(a.entry_title || '(sans titre)');
  const typeStr    = `${ITEM_ICON[a.type] || '☐'} ${ITEM_LABEL[a.type] || a.type || 'item'}`;
  const entryDate  = formatDate(a.entry_date);
  const agentHtml  = a.agent_result
    ? `<div class="agent-result">${escapeHtml(a.agent_result)}</div>`
    : '';
  const delegateBtn = a.type === 'task' && st !== 'done'
    ? `<button class="btn-delegate" onclick="executeTask('${a.id}',event)">✦ IA</button>`
    : '';
  return `
    <div class="action-row ${stClass}" id="arow-${a.id}">
      <div class="action-row-inner">
        <button class="status-btn status-${stClass}"
                onclick="cycleStatus('${a.id}','${st}',event)"
                data-status="${st}" title="Changer le statut">
          ${STATUS_ICON[st] || STATUS_ICON.todo}
        </button>
        <div class="action-row-body" style="flex:1;min-width:0">
          <span class="action-row-text">${escapeHtml(a.text)}</span>
          <span class="action-row-meta">
            ${entryTitle}
            <span class="meta-sep">·</span>
            ${typeStr}
            <span class="meta-sep">·</span>
            ${entryDate}
          </span>
          ${agentHtml}
        </div>
        ${delegateBtn}
      </div>
    </div>`;
}

async function cycleStatus(itemId, currentStatus, e) {
  e.stopPropagation();
  const nextStatus = NEXT_STATUS[currentStatus] || 'todo';
  const stClass    = nextStatus === 'in_progress' ? 'in-progress' : nextStatus;

  // Optimistic UI
  const row = document.getElementById(`arow-${itemId}`);
  const btn = row?.querySelector('.status-btn');
  if (btn) {
    btn.className      = `status-btn status-${stClass}`;
    btn.innerHTML      = STATUS_ICON[nextStatus] || STATUS_ICON.todo;
    btn.dataset.status = nextStatus;
  }
  if (row) {
    row.className = `action-row ${stClass}`;
    const delBtn = row.querySelector('.btn-delegate');
    if (delBtn) delBtn.style.display = nextStatus === 'done' ? 'none' : '';
  }

  try {
    const res = await fetch(`/api/actions?id=${itemId}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: nextStatus }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const action = allActions.find(a => a.id === itemId);
    if (action) {
      action.status = nextStatus;
      action.done   = nextStatus === 'done';

      // Slide out si le filtre ne correspond plus
      if ((currentFilter === 'todo' && nextStatus !== 'todo') ||
          (currentFilter === 'in_progress' && nextStatus !== 'in_progress')) {
        if (row) { row.style.animation = 'fadeOut 0.35s forwards'; setTimeout(() => renderAll(), 380); }
      }

      // Mise à jour stats
      const doneCount   = allActions.filter(a => getStatus(a) === 'done').length;
      const inProgCount = allActions.filter(a => getStatus(a) === 'in_progress').length;
      const todoCount   = allActions.filter(a => getStatus(a) === 'todo').length;
      document.getElementById('stat-done').textContent       = doneCount;
      document.getElementById('stat-inprogress').textContent = inProgCount;
      document.getElementById('stat-todo').textContent       = todoCount;
      refreshProjectBadge(groupKey(action));
    }
  } catch (err) {
    const prevClass = currentStatus === 'in_progress' ? 'in-progress' : currentStatus;
    if (btn) { btn.className = `status-btn status-${prevClass}`; btn.innerHTML = STATUS_ICON[currentStatus] || STATUS_ICON.todo; btn.dataset.status = currentStatus; }
    if (row)  row.className = `action-row ${prevClass}`;
    console.error('cycleStatus error:', err);
  }
}

async function executeTask(itemId, e) {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.disabled    = true;
  btn.textContent = '⌛…';
  try {
    const res = await fetch(`/api/actions?action=execute&id=${itemId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const action = allActions.find(a => a.id === itemId);
    if (action) { action.status = 'in_progress'; action.agent_result = data.result; }

    const row = document.getElementById(`arow-${itemId}`);
    if (row) {
      // Afficher résultat
      let agentDiv = row.querySelector('.agent-result');
      if (!agentDiv) { agentDiv = document.createElement('div'); agentDiv.className = 'agent-result'; row.querySelector('.action-row-body').appendChild(agentDiv); }
      agentDiv.textContent = data.result;

      // Passer en in_progress
      const statusBtn = row.querySelector('.status-btn');
      if (statusBtn && statusBtn.dataset.status === 'todo') {
        statusBtn.className      = 'status-btn status-in-progress';
        statusBtn.innerHTML      = STATUS_ICON.in_progress;
        statusBtn.dataset.status = 'in_progress';
        row.classList.add('in-progress');
      }
    }
    btn.textContent = '✦ IA';
    btn.disabled    = false;
  } catch (err) {
    btn.textContent = '✦ IA';
    btn.disabled    = false;
    console.error('executeTask error:', err);
  }
}

function refreshProjectBadge(key) {
  const inGroup  = allActions.filter(a => groupKey(a) === key);
  const pending  = inGroup.filter(a => getStatus(a) !== 'done').length;
  document.querySelectorAll('.project-group').forEach(g => {
    const nameEl = g.querySelector('.project-name');
    if (nameEl && nameEl.textContent.trim() === `🏷 ${key}`) {
      const badge = g.querySelector('.project-badge');
      if (badge) {
        badge.textContent = pending > 0 ? `${pending} à faire` : '✓ tout fait';
        badge.className   = pending > 0 ? 'project-badge' : 'project-badge all-done';
      }
    }
  });
}



async function loadActions() {
  try {
    const res = await fetch('/api/actions');
    if (res.status === 401) {
 return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allActions = await res.json();
    renderAll();
  } catch (err) {
    document.getElementById('actions-container').innerHTML =
      `<div class="state-error">
         <div>Impossible de charger les actions.</div>
         <div style="color:#b91c1c;font-size:13px;margin-top:6px">${err.message}</div>
       </div>`;
  }
}

loadActions();

// ── Dark mode ──────────────────────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem('vox-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('vox-theme', next);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}
