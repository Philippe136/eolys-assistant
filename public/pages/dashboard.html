async function saveEditEntry(id) {
  const title    = document.getElementById(`edit-title-${id}`)?.value.trim();
  const summary  = document.getElementById(`edit-summary-${id}`)?.value.trim();
  const category = document.getElementById(`edit-category-${id}`)?.value;
  const priority = parseInt(document.getElementById(`edit-priority-${id}`)?.value || '2', 10);
  const tagsRaw  = document.getElementById(`edit-tags-${id}`)?.value || '';
  const tags     = tagsRaw.split(',').map(t => t.trim().toLowerCase().replace(/\s+/g, '-')).filter(Boolean);

  const btn = document.querySelector(`#edit-form-${id} .btn-edit-save`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    const res = await fetch(`/api/calls?id=${id}`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ title, summary, tags, category, priority }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // Mise à jour locale sans re-render complet
    const entry = (window._calls || []).find(c => c.id === id);
    if (entry) {
      if (title)    entry.title    = title;
      if (summary)  entry.summary  = summary;
      if (category) entry.category = category;
      entry.tags = tags;

      // Mettre à jour le DOM directement
      const card = document.getElementById(`card-${id}`);
      if (card) {
        const titleEl = card.querySelector('.card-title');
        if (titleEl) titleEl.textContent = title || entry.title;
        const resumeEl = card.querySelector('.card-resume');
        if (resumeEl) resumeEl.textContent = summary || entry.summary;
        const badgeType = card.querySelector('.badge-type');
        if (badgeType) badgeType.textContent = CATEGORY_LABEL[category] || category;
      }
    }

    document.getElementById(`edit-form-${id}`)?.classList.remove('open');
  } catch (err) {
    alert('Erreur lors de la sauvegarde : ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Sauvegarder'; }
  }
}

async function retryAllErrors() {
  const errors = (window._calls || []).filter(c => c.status === 'error' && c.has_audio);
  if (!errors.length) { alert('Aucune entrée avec audio à relancer.'); return; }
  const btn = document.getElementById('btn-retry-all');
  if (btn) { btn.disabled = true; btn.textContent = `↺ ${errors.length} en cours…`; }
  let ok = 0, fail = 0;
  for (const entry of errors) {
    try {
      const res = await fetch(`/api/retry?id=${entry.id}`, { method: 'POST' });
      if (res.ok) ok++; else fail++;
    } catch { fail++; }
  }
  if (btn) { btn.disabled = false; btn.textContent = '↺ Relancer erreurs'; }
  alert(`${ok} relancée${ok>1?'s':''}, ${fail} échec${fail>1?'s':''}.`);
  loadCalls();
}

async function retryCall(id, e) {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`/api/retry?id=${id}`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await loadCalls();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '↺ Réessayer';
    alert(`Erreur lors du réessai : ${err.message}`);
  }
}

// ── Statuts 3 états ──────────────────────────────────────────────────────────
async function cycleStatus(itemId, currentStatus, e) {
  e.stopPropagation();
  const nextStatus = NEXT_STATUS[currentStatus] || 'todo';
  const stClass    = nextStatus === 'in_progress' ? 'in-progress' : nextStatus;

  // Optimistic UI
  const li  = e.target.closest('.action-item');
  const btn = li?.querySelector('.status-btn');
  if (btn) {
    btn.className   = `status-btn status-${stClass}`;
    btn.innerHTML   = STATUS_ICON[nextStatus] || STATUS_ICON.todo;
    btn.dataset.status = nextStatus;
  }
  if (li) {
    li.className = `action-item ${stClass}`;
    // Le bouton déléguer se masque si done
    const delBtn = li.querySelector('.btn-delegate');
    if (delBtn) delBtn.style.display = nextStatus === 'done' ? 'none' : '';
  }

  try {
    const res = await fetch(`/api/actions?id=${itemId}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body:   JSON.stringify({ status: nextStatus }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // Sync état local
    for (const call of (window._calls || [])) {
      const action = (call.action_items || []).find(a => a.id === itemId);
      if (action) {
        action.status = nextStatus;
        action.done   = nextStatus === 'done';

        // Compteur card-meta
        const card = e.target.closest('.call-card');
        if (card) {
          const items = call.action_items;
          const span  = [...(card.querySelector('.card-meta')?.querySelectorAll('span') || [])]
                          .find(s => s.title === 'Items faits');
          if (span) span.textContent = `☑ ${items.filter(a => a.done).length}/${items.length}`;
        }
        // Stat global
        const allItems = (window._calls || []).flatMap(c => c.action_items || []);
        const el = document.getElementById('stat-actions');
        if (el && allItems.length) el.textContent = `${allItems.filter(a => a.done).length}/${allItems.length}`;

        // Auto-archiver si toutes les tasks sont done
        const tasks = (call.action_items || []).filter(a => a.type === 'task');
        if (tasks.length > 0 && tasks.every(a => a.done) && !call.archived) {
          call.archived = true;
          fetch(`/api/calls?id=${call.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ archived: true }),
          }).catch(() => {});
          const card = e.target.closest('.call-card');
          if (card) {
            card.style.transition = 'opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease';
            card.style.opacity = '0';
            card.style.transform = 'translateX(60px)';
            card.style.maxHeight = card.offsetHeight + 'px';
            setTimeout(() => { card.style.maxHeight = '0'; card.style.padding = '0'; card.style.margin = '0'; card.style.overflow = 'hidden'; }, 200);
            setTimeout(() => card.remove(), 500);
          }
        }
        break;
      }
    }
  } catch (err) {
    // Revert
    const prevClass = currentStatus === 'in_progress' ? 'in-progress' : currentStatus;
    if (btn) { btn.className = `status-btn status-${prevClass}`; btn.innerHTML = STATUS_ICON[currentStatus] || STATUS_ICON.todo; btn.dataset.status = currentStatus; }
    if (li)  { li.className  = `action-item ${prevClass}`; }
    console.error('cycleStatus error:', err);
  }
}

// ── Déléguer une tâche à Claude ──────────────────────────────────────────────
async function executeTask(itemId, e) {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.disabled    = true;
  btn.textContent = '⌛…';
  try {
    const res = await fetch(`/api/actions?action=execute&id=${itemId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Afficher le résultat sous l'item
    const li = btn.closest('.action-item');
    if (li) {
      const existing = li.querySelector('.agent-result');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = 'agent-result';
      div.textContent = data.result;
      li.appendChild(div);

      // Mettre à jour le statut local → in_progress
      for (const call of (window._calls || [])) {
        const action = (call.action_items || []).find(a => a.id === itemId);
        if (action) { action.status = 'in_progress'; action.agent_result = data.result; break; }
      }
      // Mettre à jour le bouton status
      const statusBtn = li.querySelector('.status-btn');
      if (statusBtn && statusBtn.dataset.status === 'todo') {
        statusBtn.className   = 'status-btn status-in-progress';
        statusBtn.innerHTML   = STATUS_ICON.in_progress;
        statusBtn.dataset.status = 'in_progress';
        li.classList.add('in-progress');
      }
    }
    btn.textContent = '✦ IA';
    btn.disabled    = false;
  } catch (err) {
    btn.textContent = '✦ IA';
    btn.disabled    = false;
    console.error('executeTask error:', err);
  }
}

// ── Statistiques détaillées ───────────────────────────────────────────────────
let statsPanelVisible = false;

function toggleStatsPanel() {
  const panel = document.getElementById('stats-panel');
  statsPanelVisible = !statsPanelVisible;
  panel.style.display = statsPanelVisible ? 'block' : 'none';
  if (statsPanelVisible) renderStatsPanel(window._calls || []);
}

function renderStatsPanel(calls) {
  const done = calls.filter(c => c.status === 'done');

  // 1. Répartition par catégorie
  const typeCounts = {};
  for (const c of done) { const t = CATEGORY_LABEL[c.category] || c.category || 'autre'; typeCounts[t] = (typeCounts[t] || 0) + 1; }
  const typeEntries = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);
  const typeMax     = typeEntries[0]?.[1] || 1;
  const typeBars    = typeEntries.map(([label, count]) => `
    <div class="bar-row">
      <span class="bar-label">${escapeHtml(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/typeMax*100)}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>`).join('') || '<span style="font-size:12px;color:var(--ink-dim)">Aucun enregistrement traité</span>';

  // 2. Top 5 tags
  const projCounts = {};
  for (const c of done) { for (const t of (c.tags || [])) projCounts[t] = (projCounts[t] || 0) + 1; }
  const projEntries = Object.entries(projCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const projMax     = projEntries[0]?.[1] || 1;
  const projBars    = projEntries.map(([label, count]) => `
    <div class="bar-row">
      <span class="bar-label">${escapeHtml(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/projMax*100)}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>`).join('') || '<span style="font-size:12px;color:var(--ink-dim)">Aucun tag</span>';

  // 3. Volume hebdomadaire (5 dernières semaines)
  function isoWeek(dateStr) {
    const d = new Date(dateStr);
    const day = d.getDay() || 7;
    d.setDate(d.getDate() + 4 - day);
    const y = d.getFullYear();
    const jan1 = new Date(y, 0, 1);
    const wk = Math.ceil(((d - jan1) / 86400000 + 1) / 7);
    return `${y}-S${String(wk).padStart(2, '0')}`;
  }
  const weekCounts = {};
  for (const c of calls) { const wk = isoWeek(c.created_at); weekCounts[wk] = (weekCounts[wk] || 0) + 1; }
  const weekEntries = Object.entries(weekCounts).sort((a, b) => a[0].localeCompare(b[0])).slice(-5);
  const weekMax     = Math.max(...weekEntries.map(e => e[1]), 1);
  const weekBars    = weekEntries.map(([label, count]) => `
    <div class="bar-row">
      <span class="bar-label">${escapeHtml(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/weekMax*100)}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>`).join('') || '<span style="font-size:12px;color:var(--ink-dim)">Aucun appel</span>';

  document.getElementById('stats-panel-content').innerHTML = `
    <div class="stats-grid">
      <div>
        <div class="stats-section-title">Par catégorie</div>
        ${typeBars}
      </div>
      <div>
        <div class="stats-section-title">Top tags</div>
        ${projBars}
      </div>
      <div>
        <div class="stats-section-title">Volume / semaine</div>
        ${weekBars}
      </div>
    </div>`;
}



async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    if (res.ok) projects = await res.json();
  } catch { /* silencieux */ }
}

async function loadCalls() {
  try {
    if (!projects.length) await loadProjects();
    const url = showArchived ? '/api/calls?archived=1&limit=50' : '/api/calls?limit=50';
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const calls = await res.json();
    renderList(calls);
    document.getElementById('last-refresh').textContent =
      'Mis à jour ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    document.getElementById('calls-list').innerHTML =
      `<div class="state-error">
        <div>Impossible de charger les enregistrements.</div>
        <div class="error-text">${err.message}</div>
       </div>`;
  }
}

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
async function doRefresh() {
  const btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  try { await loadCalls(); } finally {
    if (btn) btn.classList.remove('spinning');
  }
}

// Prévisualisation manuelle des groupes — appelée au clic sur "Fusionner"
let _mergePreviewGroups = null;

async function mergeSimilar() {
  const btn = document.getElementById('btn-merge');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Analyse…';
  try {
    const res = await fetch('/api/calls?action=merge-preview', { method: 'POST' });
    const data = await res.json();
    _mergePreviewGroups = data.groups || [];
    if (!_mergePreviewGroups.length) {
      btn.textContent = 'Aucun groupe détecté';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Fusionner'; }, 2000);
      return;
    }
    // Afficher la bulle de prévisualisation
    const preview = document.getElementById('merge-preview');
    const content = document.getElementById('merge-preview-content');
    content.innerHTML = `
      <div style="font-weight:600;margin-bottom:10px">${_mergePreviewGroups.length} groupe${_mergePreviewGroups.length > 1 ? 's' : ''} proposé${_mergePreviewGroups.length > 1 ? 's' : ''}</div>
      ${_mergePreviewGroups.map((g, i) => `
        <div style="margin-bottom:10px;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">
          <div style="font-weight:600;font-size:13px;margin-bottom:4px">→ ${g.merged_title || 'Sans titre'}</div>
          <div style="font-size:11px;color:var(--ink-muted)">${(g.note_titles || g.ids).map(t => `• ${t}`).join('<br>')}</div>
        </div>
      `).join('')}
    `;
    preview.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Fusionner';
  } catch (e) {
    btn.textContent = 'Erreur';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Fusionner'; }, 2000);
  }
}

function closeMergePreview() {
  const preview = document.getElementById('merge-preview');
  if (preview) preview.style.display = 'none';
  _mergePreviewGroups = null;
}

async function confirmMerge() {
  if (!_mergePreviewGroups || !_mergePreviewGroups.length) return;
  const btn = document.getElementById('btn-confirm-merge');
  if (btn) { btn.disabled = true; btn.textContent = 'Fusion…'; }
  try {
    const res = await fetch('/api/calls?action=merge-confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groups: _mergePreviewGroups }),
    });
    const data = await res.json();
    closeMergePreview();
    await loadCalls();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Confirmer la fusion'; }
  }
}
// ── Dark mode ──────────────────────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem('vox-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('vox-theme', next);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}

// ── Offline banner + SW sync ──────────────────────────────────────────────────
function showOfflineBanner(msg) {
  let banner = document.getElementById('offline-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'offline-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--yellow);color:#1a1714;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;';
    document.body.prepend(banner);
  }
  banner.textContent = msg;
  banner.style.display = '';
}
function hideOfflineBanner() {
  const b = document.getElementById('offline-banner');
  if (b) b.style.display = 'none';
}
window.addEventListener('offline', () => showOfflineBanner('📡 Hors ligne — les notes seront synchronisées à la reconnexion'));
window.addEventListener('online',  () => {
  hideOfflineBanner();
  // Demander sync au service worker
  if ('serviceWorker' in navigator && 'SyncManager' in window) {
    navigator.serviceWorker.ready.then(reg => reg.sync.register('sync-queue').catch(()=>{}));
  }
  loadCalls();
});
if (!navigator.onLine) showOfflineBanner('📡 Hors ligne — les notes seront synchronisées à la reconnexion');
// Écouter les messages SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'QUEUED_OFFLINE') showOfflineBanner(`📡 Note sauvegardée hors ligne : "${(e.data.text||'').slice(0,40)}…"`);
    if (e.data?.type === 'SYNC_DONE') { hideOfflineBanner(); loadCalls(); }
  });
}

// ── Export PDF ────────────────────────────────────────────────────────────────
function exportPDF() {
  window.print();
}
