<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vox">
<meta name="theme-color" content="#f5f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<title>Vox — Priorités</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Native PWA feel ── */
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { overscroll-behavior: none; }
  body { overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
  button, a, [role="button"] { touch-action: manipulation; }
  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --surface2: #f0ece5;
    --border: #e0d9cf;
    --ink: #1a1714;
    --ink-muted: #7a7268;
    --ink-dim: #b5afa6;
    --accent: #c8410a;
    --accent-light: #f5ede8;
    --green: #1a6b3c;
    --green-light: #e8f3ec;
    --yellow: #d4a017;
    --yellow-light: #fdf6e3;
    --red: #b91c1c;
    --red-light: #fef2f2;
    --blue: #1d4ed8;
    --blue-light: #eff6ff;
    --radius: 12px;
  }

  :root[data-theme="dark"] {
  --bg: #151210;
  --surface: #1e1b18;
  --surface2: #252220;
  --border: #35302a;
  --ink: #f0ece5;
  --ink-muted: #a09890;
  --ink-dim: #6a6460;
  --accent-light: #3a1a0a;
  --green-light: #0d2e1a;
  --yellow-light: #2a2000;
  --red-light: #2a0d0d;
  --blue-light: #0d1a3a;
}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: env(safe-area-inset-top, 0px) 24px 0;
    height: calc(56px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo svg { flex-shrink: 0; display: block; }

  .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  .header-nav { display: flex; align-items: center; gap: 4px; }

  .btn-ghost {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, color .15s;
  }

  .btn-ghost:hover { background: var(--surface2); color: var(--ink); }

  .btn-primary {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity .15s;
  }

  .btn-primary:hover { opacity: .88; }

  /* ── Main layout ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .page-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .page-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-muted);
  }

  /* ── Sections ── */
  .section {
    margin-bottom: 32px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .section-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--ink-muted);
  }

  .section-badge.red  { background: var(--red-light);    color: var(--red); }
  .section-badge.yellow { background: var(--yellow-light); color: var(--yellow); }
  .section-badge.blue   { background: var(--blue-light);   color: var(--blue); }
  .section-badge.green  { background: var(--green-light);  color: var(--green); }

  /* ── Item cards ── */
  .item-list { display: flex; flex-direction: column; gap: 6px; }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: border-color .15s, box-shadow .15s;
  }

  .item-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }

  .item-card.done { opacity: .5; }

  .item-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s;
  }

  .item-check.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    font-size: 11px;
  }

  .item-body { flex: 1; min-width: 0; }

  .item-text {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
  }

  .item-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 5px;
  }

  .item-source {
    font-size: 12px;
    color: var(--ink-muted);
    text-decoration: none;
    transition: color .15s;
  }

  .item-source:hover { color: var(--accent); }

  .item-due {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
  }

  .item-due.overdue { background: var(--red-light); color: var(--red); font-weight: 600; }
  .item-due.today   { background: var(--yellow-light); color: var(--yellow); font-weight: 600; }

  .project-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    border-left: 3px solid;
    background: var(--surface2);
    color: var(--ink-muted);
  }

  .type-badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--ink-dim);
  }

  /* ── Entry cards ── */
  .entry-list { display: flex; flex-direction: column; gap: 8px; }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color .15s, box-shadow .15s;
  }

  .entry-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }

  .entry-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .entry-summary {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .entry-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .entry-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 24px;
    color: var(--ink-dim);
    font-size: 13px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  /* ── Loading skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 8px;
    height: 56px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── All done state ── */
  .all-done {
    text-align: center;
    padding: 48px 24px;
  }

  .all-done-emoji { font-size: 48px; margin-bottom: 16px; }
  .all-done-title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 8px; }
  .all-done-sub   { font-size: 14px; color: var(--ink-muted); }

  /* ── Bottom Nav Mobile ── */
  /* ── Rétrospective ── */
  .retro-card {
    background: linear-gradient(135deg, #1a1714 0%, #2d2520 100%);
    color: #f5f2ed;
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .retro-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .retro-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.6; }
  .retro-score {
    display: flex; align-items: center; gap: 10px;
  }
  .retro-score-num {
    font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1;
  }
  .retro-score-label { font-size: 11px; opacity: 0.5; }
  .retro-bar {
    height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px;
    margin-bottom: 16px; overflow: hidden;
  }
  .retro-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .retro-mood { font-size: 13px; opacity: 0.7; margin-bottom: 12px; }
  .retro-themes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .retro-theme {
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    background: rgba(255,255,255,0.12); border-radius: 20px;
  }
  .retro-section { margin-bottom: 10px; }
  .retro-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.5; margin-bottom: 5px; }
  .retro-list { list-style: none; }
  .retro-list li { font-size: 13px; line-height: 1.5; opacity: 0.85; padding: 2px 0; }
  .retro-list li::before { content: "→ "; opacity: 0.5; }
  .retro-suggestion {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 13.5px; line-height: 1.6; font-style: italic; opacity: 0.9;
  }
  .retro-footer {
    margin-top: 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .retro-meta { font-size: 11px; opacity: 0.4; }
  .btn-retro-gen {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    padding: 5px 12px; border-radius: 7px;
    background: rgba(255,255,255,0.12); color: #f5f2ed;
    border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
    transition: background 0.15s;
  }
  .btn-retro-gen:hover { background: rgba(255,255,255,0.2); }
  .btn-retro-gen:disabled { opacity: 0.4; cursor: default; }

  .mobile-nav { display: none; }

  @media (max-width: 640px) {
    header { padding: env(safe-area-inset-top, 0px) 16px 0; }
    .header-nav { gap: 6px; }
    .header-nav .btn-ghost { display: none; }
    main { padding: 16px 14px calc(100px + env(safe-area-inset-bottom, 0px)); }
    .page-title { font-size: 20px; }
    .section-title { font-size: 13px; }
    .mobile-nav { display: flex; }
  }

  .mobile-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(76px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--border);
    align-items: stretch;
    justify-content: space-around;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mobile-nav a {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; flex: 1;
    font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
    text-transform: uppercase; color: var(--ink-dim);
    text-decoration: none; transition: color 0.15s; padding: 6px 0;
  }
  .mobile-nav a.active { color: var(--accent); }
  .mobile-nav a svg { width: 24px; height: 24px; }
  .mobile-nav a.nav-record {
    color: #fff; background: var(--accent); border-radius: 14px;
    margin: 8px 4px; padding: 0 12px; font-size: 18px;
    line-height: 1; flex: 0 0 52px;
  }

  /* ── Bouton refresh ── */
  .btn-refresh {
    width: 32px; height: 32px; border: none; background: none; cursor: pointer;
    padding: 0; border-radius: 8px; color: var(--ink-dim); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .btn-refresh:hover { background: var(--surface2); color: var(--ink); }
  .btn-refresh.spinning svg { animation: spin-refresh 0.65s linear infinite; }
  @keyframes spin-refresh { to { transform: rotate(360deg); } }

  .btn-theme-toggle { font-size: 18px !important; padding: 4px 8px !important; }
</style>
</head>
<body>

<header>
  <div class="logo"><svg width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="0" y="6" width="4" height="6" rx="2" fill="#c8410a"/><rect x="6" y="0" width="4" height="18" rx="2" fill="#c8410a"/><rect x="12" y="3" width="4" height="12" rx="2" fill="#c8410a"/><rect x="18" y="5" width="4" height="8" rx="2" fill="#c8410a"/></svg>Vox</div>
  <div class="header-nav">
    <a href="/dashboard" class="btn-ghost">Dashboard</a>
    <a href="/actions"   class="btn-ghost">Items</a>
    <a href="/today"     class="btn-ghost" style="color:var(--accent)">Priorités</a>
      <button class="btn-refresh" id="btn-refresh" onclick="doRefresh()" title="Rafraîchir">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>
    </button>
    <button class="btn-ghost btn-theme-toggle" onclick="toggleTheme()" id="btn-theme" title="Thème sombre/clair" style="font-size:18px;padding:4px 8px">🌙</button>
  </div>
</header>

<main>
  <div class="page-header">
    <h1 class="page-title">🎯 Priorités</h1>
    <span class="page-date" id="page-date"></span>
  </div>

  <div id="content">
    <div class="item-list">
      <div class="skeleton"></div>
      <div class="skeleton" style="height:48px"></div>
      <div class="skeleton" style="height:64px"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

const now = new Date();
$('page-date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

const IMPORTANCE_COLORS = { 4: 'var(--red)', 3: 'var(--yellow)', 2: 'var(--ink-dim)', 1: 'var(--blue)' };
const PRIORITY_DOTS = { 4: 'var(--red)', 3: '#d97706' };

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
}

function renderSummary(text) {
  if (!text) return '';
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const bullets = lines.map(l => l.replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  if (bullets.length <= 1) return `<div class="entry-summary">${esc(text)}</div>`;
  return `<div class="entry-summary"><ul style="padding-left:16px;margin:0">${bullets.map(b => `<li style="margin-bottom:2px">${esc(b)}</li>`).join('')}</ul></div>`;
}

async function loadData() {
  try {
    const res = await fetch('/api/calls?action=priorities');
    if (res.status === 401) { window.location.href = '/login'; return; }
    if (!res.ok) throw new Error(await res.text());
    const entries = await res.json();

    if (!entries.length) {
      $('content').innerHTML = `
        <div class="all-done">
          <div class="all-done-emoji">📭</div>
          <div class="all-done-title">Aucune note</div>
          <div class="all-done-sub">Commencez par enregistrer vos premières notes sur le dashboard.</div>
        </div>`;
      return;
    }

    // Grouper par dossier
    const groups = [];
    const groupMap = new Map();
    for (const e of entries) {
      const key = e.folder_id || '__none__';
      if (!groupMap.has(key)) {
        const g = {
          folder_id: e.folder_id,
          folder_name: e.folder_name || 'Non classées',
          folder_emoji: e.folder_emoji || '📥',
          folder_importance: e.folder_importance || 0,
          entries: [],
        };
        groupMap.set(key, g);
        groups.push(g);
      }
      groupMap.get(key).entries.push(e);
    }

    let html = '';
    for (const group of groups) {
      const impColor = IMPORTANCE_COLORS[group.folder_importance] || 'var(--ink-dim)';
      html += `
        <div class="section" style="margin-bottom:28px">
          <div class="section-header" style="margin-bottom:10px">
            <span style="font-size:22px">${esc(group.folder_emoji)}</span>
            <span class="section-title" style="font-size:15px;text-transform:none;letter-spacing:-0.2px;font-weight:700;color:var(--ink)">${esc(group.folder_name)}</span>
            <span class="section-badge" style="background:transparent;color:${impColor};font-weight:700">${group.entries.length}</span>
          </div>
          <div class="entry-list">
            ${group.entries.map(e => {
              const dot = PRIORITY_DOTS[e.priority]
                ? `<div style="width:8px;height:8px;border-radius:50%;background:${PRIORITY_DOTS[e.priority]};flex-shrink:0;margin-top:5px"></div>`
                : '';
              const tags = (e.tags||[]).map(t => `<span class="type-badge">${esc(t)}</span>`).join('');
              return `
                <a class="entry-card" href="/dashboard?entry=${e.id}" style="text-decoration:none;color:inherit">
                  <div style="display:flex;align-items:flex-start;gap:8px">
                    ${dot}
                    <div style="flex:1;min-width:0">
                      <div class="entry-title">${esc(e.title || 'Sans titre')}</div>
                      ${renderSummary(e.summary)}
                    </div>
                    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);white-space:nowrap;flex-shrink:0">${fmtDate(e.created_at)}</span>
                  </div>
                  ${tags ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${tags}</div>` : ''}
                </a>`;
            }).join('')}
          </div>
        </div>`;
    }

    $('content').innerHTML = html;
  } catch (err) {
    $('content').innerHTML = `<div class="empty">Erreur : ${esc(err.message)}</div>`;
  }
}

loadData();
</script>

</nav>

<script src="/app.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
async function doRefresh() {
  const btn = document.getElementById('btn-refresh');
  if (btn) btn.classList.add('spinning');
  try { await loadData(); } finally {
    if (btn) btn.classList.remove('spinning');
  }
}
// ── Dark mode ──────────────────────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem('vox-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('vox-theme', next);
  const btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}
</script>
</body>
</html>
